apiVersion: apps/v1
kind: Deployment
metadata:
  name: shopping-bill-deployment
  labels:
    app: shopping-bill
spec:
  replicas: 2
  selector:
    matchLabels:
      app: shopping-bill
  template:
    metadata:
      labels:
        app: shopping-bill
    spec:
      containers:
      - name: shopping-bill-container
        # The pipeline replaces this placeholder image tag dynamically on each push
        image: JMK200611/shopping-bill-calculator:latest
        ports:
        - containerPort: 8080
