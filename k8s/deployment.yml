apiVersion: apps/v1
kind: Deployment
metadata:
  name: shopping-calculator
  labels:
    app: shopping-calculator
spec:
  replicas: 2
  selector:
    matchLabels:
      app: shopping-calculator
  template:
    metadata:
      labels:
        app: shopping-calculator
    spec:
      containers:
      - name: calculator
        image: DOCKERHUB_USERNAME/shopping-calculator:placeholder
        ports:
        - containerPort: 80
        stdin: true
        tty: true
